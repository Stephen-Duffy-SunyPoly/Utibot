plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'uti.bot'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation("net.dv8tion:JDA:${jda_Version}")
    // Source: https://mvnrepository.com/artifact/org.slf4j/slf4j-reload4j
    implementation 'org.slf4j:slf4j-reload4j:2.0.20'
    // Source: https://mvnrepository.com/artifact/org.json/json
    implementation("org.json:json:${json_version}")
    // Source: https://mvnrepository.com/artifact/com.github.docker-java/docker-java
    implementation("com.github.docker-java:docker-java:${docker_java_version}")
    // Source: https://mvnrepository.com/artifact/com.github.docker-java/docker-java-transport-httpclient5
    implementation ("com.github.docker-java:docker-java-transport-httpclient5:${docker_java_transport_version}")
}

application {
    mainClass = 'org.cbigames.disbottest.Main'
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}