# Set root logger level to INFO and its only appender to A1.
log4j.rootLogger=INFO, A1

# A1 is set to be a ConsoleAppender.
log4j.appender.A1=org.apache.log4j.ConsoleAppender

# A1 uses a PatternLayout.
log4j.appender.A1.layout=org.apache.log4j.PatternLayout
log4j.appender.A1.layout.ConversionPattern=[%-4r] [%t] %-5p %c %x - %m%n
# %-4r left aligned with a minim of 4 charters, milliseconds since the start of the program
# %t name of the thread
# %-5p left aligned with a minim of 5 charters log level of the message
# %c logger name
# %x Nested Diagnostic Context (NDC) associated with the thread (space if no context)_
# %m the actual log message
# %n new line
